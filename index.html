<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Cart - Student Marketplace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        header { background: linear-gradient(135deg, #004080, #0066cc); color: white; padding: 2rem 1rem; text-align: center; }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { font-size: 1.1rem; opacity: 0.9; }
        nav { background: #002b5c; color: white; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
        nav .logo { font-weight: bold; font-size: 1.2rem; }
        nav button.post-btn { background: #28a745; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        nav button.post-btn:hover { background: #218838; }
        
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .container h2 { margin-bottom: 1.5rem; color: #004080; }

        /* Form Modal / Box */
        #postFormContainer { display: none; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-bottom: 2rem; border-left: 5px solid #28a745; }
        #postFormContainer h3 { margin-bottom: 1rem; color: #004080; }
        .form-row { display: flex; gap: 1rem; }
        .form-group { margin-bottom: 1rem; flex: 1; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: bold; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #218838; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; position: relative; }
        .card:hover { transform: translateY(-5px); }
        .card-body { padding: 1.5rem; }
        .card h3 { color: #004080; margin-bottom: 0.5rem; }
        .card p { color: #666; font-size: 0.95rem; margin-bottom: 0.5rem; }
        .details-tag { display: inline-block; background: #e9ecef; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; color: #495057; margin-right: 0.5rem; margin-bottom: 0.8rem; }
        .price { color: #28a745; font-size: 1.3rem; font-weight: bold; margin-bottom: 1rem; }
        .btn { display: block; width: 100%; background: #004080; color: white; text-align: center; padding: 0.75rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #002b5c; }
        footer { text-align: center; padding: 2rem; color: #777; margin-top: 3rem; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

    <header>
        <h1>Campus Cart</h1>
        <p>The student-powered marketplace with custom pricing and conditions</p>
    </header>

    <nav>
        <div class="logo">🎓 Campus Cart Marketplace</div>
        <button class="post-btn" onclick="toggleForm()">+ Post an Item</button>
    </nav>

    <div class="container">
        
        <!-- Interactive Listing Form -->
        <div id="postFormContainer">
            <h3>List Your Used Item For Sale</h3>
            <form id="itemForm" onsubmit="addItem(event)">
                <div class="form-group">
                    <label>Item Title</label>
                    <input type="text" id="title" placeholder="e.g., Engineering Textbook, Cycle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Condition / Quality</label>
                        <select id="condition" required>
                            <option value="">Select Condition</option>
                            <option value="Brand New">Brand New</option>
                            <option value="Like New">Like New (Barely used)</option>
                            <option value="Good">Good Condition</option>
                            <option value="Fair / Used">Fair / Used</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" id="color" placeholder="e.g., Black, Blue, Red" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Price (Your Currency & Amount)</label>
                    <input type="text" id="price" placeholder="e.g., $25 or ₹500" required>
                </div>
                <div class="form-group">
                    <label>Description & Pickup Details</label>
                    <textarea id="description" placeholder="Mention features or campus pickup spot..." rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Your Email (for buyer contact)</label>
                    <input type="email" id="email" placeholder="your-email@college.edu" required>
                </div>
                <button type="submit" class="submit-btn">Publish My Listing</button>
            </form>
        </div>

        <h2>Marketplace Listings</h2>
        
        <!-- Listings Grid -->
        <div class="grid" id="listingsGrid">
            <!-- Dynamically loaded items will appear here -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Campus Cart. Built for students, by students.</p>
    </footer>

    <script>
        // Load existing listings from browser memory on startup
        document.addEventListener('DOMContentLoaded', loadListings);

        function toggleForm() {
            const formBox = document.getElementById('postFormContainer');
            formBox.style.display = formBox.style.display === 'block' ? 'none' : 'block';
        }

        function addItem(event) {
            event.preventDefault();

            const newItem = {
                title: document.getElementById('title').value,
                condition: document.getElementById('condition').value,
                color: document.getElementById('color').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                email: document.getElementById('email').value
            };

            // Get existing listings or empty array
            let listings = JSON.parse(localStorage.getItem('campusCartListings')) || [];
            listings.unshift(newItem); // Add to the top

            // Save back to browser memory
            localStorage.setItem('campusCartListings', JSON.stringify(listings));

            // Refresh grid display
            loadListings();

            // Reset form and hide it
            document.getElementById('itemForm').reset();
            document.getElementById('postFormContainer').style.display = 'none';
        }

        function loadListings() {
            const grid = document.getElementById('listingsGrid');
            let listings = JSON.parse(localStorage.getItem('campusCartListings')) || [];

            // Default sample item if nothing posted yet
            if (listings.length === 0) {
                listings = [{
                    title: "TI-84 Plus Graphing Calculator",
                    condition: "Like New",
                    color: "Black",
                    price: "$45.00",
                    description: "Essential for math classes. Works perfectly.",
                    email: "support@campuscart.edu"
                }];
            }

            grid.innerHTML = "";
            listings.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-body">
                        <h3>${escapeHtml(item.title)}</h3>
                        <div>
                            <span class="details-tag">🏷️ ${escapeHtml(item.condition)}</span>
                            <span class="details-tag">🎨 ${escapeHtml(item.color)}</span>
                        </div>
                        <p>${escapeHtml(item.description)}</p>
                        <div class="price">${escapeHtml(item.price)}</div>
                        <a href="mailto:${escapeHtml(item.email)}?subject=Interested in ${encodeURIComponent(item.title)}" class="btn">Contact Seller</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
